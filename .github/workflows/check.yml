# The project gate on GitHub (decision 001 §6–7): typecheck + lint + both test projects against
# a real PostgreSQL 16. No deploy from here — the agent is the pipeline.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiber
          POSTGRES_PASSWORD: kiber
          POSTGRES_DB: kiberpride_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kiber -d kiberpride_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kiber:kiber@localhost:5433/kiberpride_test
      DATABASE_URL: postgresql://kiber:kiber@localhost:5433/kiberpride_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
