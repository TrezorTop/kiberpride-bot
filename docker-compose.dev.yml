# Local databases for the owner's workstation (decision 001 §9, 002 §8). Never used on the
# server — deploy/docker-compose.yml is the server's file and has no test database.
#   npm run db:up        → both services, waits until healthy
#   postgres       :5432 → `npm run dev` (DATABASE_URL in .env)
#   postgres-test  :5433 → `npm test` db project (TEST_DATABASE_URL), data in RAM, wiped on restart
name: kiberpride-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kiber
      POSTGRES_PASSWORD: kiber
      POSTGRES_DB: kiberpride
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiber -d kiberpride']
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: kiber
      POSTGRES_PASSWORD: kiber
      POSTGRES_DB: kiberpride_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiber -d kiberpride_test']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
